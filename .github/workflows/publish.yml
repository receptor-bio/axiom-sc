name: Publish to PyPI
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e ".[dev]"
      # Lightweight science deps needed for tier4/5 tests and Bio-mocked tests.
      - run: pip install anndata biopython scikit-learn scipy jsonschema
      - run: pytest tests/ -v --cov=axiom_sc --cov-report=xml --cov-config=pyproject.toml

  publish:
    needs: test          # publish only runs if test job passes
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # OIDC trusted publishing — no stored token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install hatch && hatch build
      - uses: pypa/gh-action-pypi-publish@release/v1
